<footer class="site-footer">
  <div class="frame footer-inner">
    <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
    <ul class="footer-links">
      <li><a href="https://github.com/{{ site.social.github }}">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.social.linkedin }}">LinkedIn</a></li>
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      {%- if site.resume and site.resume != '' %}
      <li><a href="{{ site.resume | relative_url }}">Résumé</a></li>
      {%- endif %}
    </ul>
  </div>
</footer>
