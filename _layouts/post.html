---
layout: default
---
<article class="frame prose-page">
  <header class="page-head">
    <p class="eyebrow"><a href="{{ '/writing/' | relative_url }}">Writing</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {%- if page.description %}<p class="section-sub">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
