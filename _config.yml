#  Most of the page content lives in _data/*.yml — edit those
#  to add projects, experience, or archive items.
# ─────────────────────────────────────────────────────────────

title: Kyler Russell
tagline: ML research · low-bit LLM quantization · recurrent & brain-inspired models · RL
description: >-
  Kyler Russell is a computer science student at the University of Kansas
  and independent ML researcher working on extreme low-bit (ternary) LLM
  quantization, recurrent and brain-inspired architectures, and reinforcement learning.
url: "https://kylerrussell.github.io"
baseurl: ""
lang: en

author:
  name: Kyler Russell
  email: KylerRssll@gmail.com
  location: Lenexa, Kansas
  image: /assets/img/portrait.jpg

social:
  github: KylerRussell
  linkedin: kyler-russell

# Set to a path like /assets/kyler-russell-resume.pdf to show a résumé button
resume: /assets/kyler-russell-resume.pdf

# "Now active" lab radar under the hero — one short line per active thread.
radar:
  - { tag: CTM, text: "per-mechanism ablations of the CTM Transformer" }
  - { tag: Brain, text: "language-capability audits" }
  - { tag: Quant, text: "Qwen3.6-27B → TQ1_64" }
  - { tag: RL, text: "stabilising PPO for AlphaSlayer" }

# jekyll-seo-tag
logo: /assets/img/portrait.jpg
image: /assets/img/portrait.jpg

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /writing/:year/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  # Original full-resolution photos. Web-sized copies live in assets/img/.
  - assets/images/
  - _to_delete/
  - .claude-tmp/
