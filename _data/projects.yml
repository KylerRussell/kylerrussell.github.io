# Personal projects. `current: true` shows a project on the home page; `active: true` marks it ongoing;
# every project is listed on /archive/ under its start `year`.
# Fields: title, kind, year, period, current, url, summary, tags, plus optional
#   feature (true = large panel with architecture figure), finding, story,
#   networks, spec (list of {key, value}) for the spec-sheet style card.

- title: AlphaSlayer
  kind: Personal project
  year: "2026"
  period: "2026"
  current: true
  active: true
  feature: true
  subtitle: A two-network RL agent for Slay the Spire 2
  url: "https://github.com/KylerRussell/AlphaSlayer"
  finding: "Scripted heuristics out-reached the trained net on bosses → the bottleneck was run policy, not combat"
  summary: >-
    Slay the Spire is two problems stacked: winning each fight, and steering a
    whole run so you arrive at the boss with a deck and HP that can win.
    AlphaSlayer splits them into a fast tactical network and a larger strategic
    one, both Transformer encoders over set-tokenized game state.
  story:
    - { label: "Observation", text: "Hand-written heuristics beat the trained agent on boss-reach rate." }
    - { label: "Diagnosis", text: "Combat skill wasn't the ceiling — HP and deck management before bosses was." }
    - { label: "Rebuild", text: "Training reworked around Generalized Advantage Estimation and paired-seed evaluation." }
  networks:
    - { name: Combat network, size: "~5–15M params", input: "Hand · piles · enemies & intents", output: "Card plays & targets" }
    - { name: Run network, size: "~20–50M params", input: "Deck · relics · HP · map", output: "Deck building & HP management" }
  tags: [Reinforcement learning, PyTorch, Transformers, GAE]

