# Personal projects. `current: true` shows a project on the home page; `active: true` marks it ongoing;
# every project is listed on /archive/ under its start `year`.
# Fields: title, kind, year, period, current, url, summary, tags, plus optional
#   feature (true = large panel with architecture figure), finding, story,
#   networks, spec (list of {key, value}) for the spec-sheet style card.

- title: AlphaSlayer
  kind: Personal project
  year: "2026"
  period: Aug 2026 – present
  current: true
  active: true
  feature: true
  subtitle: One transformer that plays every Slay the Spire 2 decision
  url: "https://github.com/KylerRussell/AlphaSlayer"
  finding: "AlphaZero-style turn search in elite and boss fights nearly doubles the win rate — 0.080 → 0.156 over 463 paired seeds (p < 0.001) — after potential shaping made PPO stable but stuck at the distilled policy"
  summary: >-
    AlphaSlayer replaced its separate combat and run networks with one 18.5M-parameter
    transformer over entity tokens: every legal action is a candidate token that
    attends to the whole state, so a card reward can look at the deck it would join.
    One run-level value prices potions, HP and resources by what they're worth
    later in the run.
  story:
    - { label: "Distil", text: "Imitation on 786k decisions: one network matches both old teachers at every size (91.5% held-out agreement; win rate 0.056 vs 0.048)." }
    - { label: "Diagnose", text: "Win-only PPO random-walked at 1–2 wins per iteration; run-level value heads were memorising runs, not generalising." }
    - { label: "Stabilise", text: "Potential-based shaping, per-floor λ and per-kind advantage centring: the first stable PPO configuration." }
    - { label: "Search", text: "Exact in-game fight restore (3,310 / 3,310 replays match) enables turn search: win 0.080 → 0.156, act-2 clears 0.30 → 0.43; fixing restore leaks made each search ~12× faster." }
    - { label: "Now", text: "Distilling search back into the policy: act-1 clears +0.035 after 20 iterations (p 0.03), win rate not yet moved. Card, shop and route search added on top." }
  figure_caption: "fig. 1 — one network, every decision"
  networks:
    - name: Combat decision
      size: "18.5M params · shared"
      nodes: ["Hand · enemies · piles · potions", "One token per play & target", "Shared trunk (loopable core)", "Card play & target"]
    - name: Run decision
      size: "same weights"
      nodes: ["Deck · relics · map · gold", "One token per reward, shop item, path", "Shared trunk (loopable core)", "Deck building & route"]
  tags: [Reinforcement learning, PPO, GAE, Search, Distillation, PyTorch]

