- title: CyberPatriot — 5th of 5,266 nationally
  kind: High school
  year: "2021"
  period: "2021 – 24"
  summary: >-
    Networking specialist and club president for our team in the Air Force
    Association's national youth cyber-defense competition — firewall policy,
    vulnerability remediation and system hardening against the clock — finishing
    5th of 5,266 teams at the national finals in Washington, D.C.
  tags: [Cybersecurity, Networking]
  images:
    - { src: /assets/img/cp-logo.jpg, alt: "CyberPatriot logo", fit: contain }
    - { src: /assets/img/cp-capitol.jpg, alt: "The U.S. Capitol during the national finals trip" }

