# Research triad — three equal pillars on the home page; also listed on /archive/.
# Fields: pillar, title, repo, status, period, year (start year, for /archive/),
#         current (true = show on home page), active (true = ongoing; shows a pulse on /archive/), finding (one line, shown as a
#         high-contrast badge), summary, points (≤4), links (list of {label, url})

- pillar: Recurrent computation
  title: The CTM Transformer
  repo: CTM-Transformer
  status: Active
  period: Apr 2026 – present
  year: "2026"
  kind: Research
  current: true
  active: true
  finding: "Beats the matched 8-layer Transformer by 0.040 nats on both seeds — but ties the best recurrent-depth Transformer (+0.014) under a pre-registered 0.02 rule"
  summary: >-
    A Transformer whose own layers take on Continuous Thought Machine mechanisms
    (arXiv:2505.05522) — internal ticks, neuron-level models, synchronization-driven
    attention — zero-initialized so it starts exactly as its baselines, then
    compared against the best recurrent-depth Transformer (arXiv:2502.05171) at
    matched size, 400M tokens, two seeds.
  points:
    - "Withdrew my own earlier headline: the 0.157-nat tick gain came from a non-residual readout — with a residual path the ticks were worth 0.012"
    - "Diagnosed a separate-head CTM's dead ticks: the gain was a quadratic feature of the start state, with tiny tick states and decays stuck at 0 trapping the synchronization readout"
    - "Tuned a recurrent-depth recipe that beats its matched Transformer by 0.054 nats on both seeds and lands within ~0.02 of a 20-layer Transformer at equal compute"
    - "Now running per-mechanism ablations (sync queries, sync output, neuron-level models), rules fixed before the runs"
  links:
    - { label: "GitHub", url: "https://github.com/KylerRussell/CTM-Transformer" }

- pillar: Biological computation
  title: Living Brain
  repo: Living-Brain
  status: Active
  period: Jan 2026 – present
  year: "2026"
  kind: Research
  current: true
  active: true
  finding: "Recalls familiar phrases at 88.6% next-byte accuracy — but harder language tasks stay below a bigram baseline, and a periodic weight reset was cutting recall to 23.7%"
  summary: >-
    A biologically grounded neural engine: GPU predictive coding over thousands
    of model neurons on hierarchical modular graphs, with NMDA/AMPA dynamics,
    shunting inhibition, interneuron subtypes, local plasticity and a cerebellar
    learner — now under reproducible language-capability audits.
  points:
    - "Found and fixed six implementation defects — learned weights ignored during settling, reversed sparse propagation, missing intra-column wiring, overridden noise settings"
    - "Language audits use clean seeded splits, train-only n-gram baselines, balanced delayed-cue probes and matched reset controls; every score independently recomputed"
    - "Cerebellar module passed a 26-benchmark neurobiology suite in July — eyeblink, VOR and saccade adaptation, interval timing"
  links:
    - { label: "GitHub", url: "https://github.com/KylerRussell/Living-Brain" }

- pillar: Discrete computation
  title: Ternary LLM quantization
  repo: Model-to-Ternary
  status: Active
  period: May 2026 – present
  year: "2026"
  kind: Research
  current: true
  active: true
  finding: "1.78 bits / weight · 82.1% held-out token agreement · closed-form Gram solve cuts compute 20–30×"
  summary: >-
    Compressing Qwen3.6-27B — a 64-layer hybrid Gated-DeltaNet / attention model —
    to {−1, 0, +1} weights that run natively in llama.cpp: rotation → calibration →
    block-wise reconstruction → latent assignment training → distillation → GGUF.
  points:
    - "Designed TQ1_64, a self-contained ternary format with a bit-exact reference encoder; 64-weight scale groups beat stock 256-weight formats (79.3% → 82.1%)"
    - "Surveyed 13 sub-2-bit format families: reconstruction error predicts perplexity at r = 0.996 — including where my own format was Pareto-dominated"
    - "Traced 3.5–4× slowdowns to CPU-optimizer serialization; fixed with a fused multi-threaded Adam and pinned async H2D ring buffers"
  links:
    - { label: "GitHub", url: "https://github.com/KylerRussell/Model-to-Ternary" }
